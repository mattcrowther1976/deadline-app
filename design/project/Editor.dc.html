<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0A0B}
a{color:#FF4D3D;text-decoration:none}a:hover{color:#FF6F61}
button,input{font-family:inherit}
button:disabled{opacity:0.35}
input::placeholder{color:#8B8B94}
.cf{background-color:#0E0E10;background-image:linear-gradient(27deg,#141416 3px,transparent 3px),linear-gradient(207deg,#141416 3px,transparent 3px),linear-gradient(27deg,#1C1C1F 3px,transparent 3px),linear-gradient(207deg,#1C1C1F 3px,transparent 3px),linear-gradient(90deg,#161618 6px,transparent 6px),linear-gradient(#18181B 25%,#131315 25%,#131315 50%,transparent 50%,transparent 75%,#1E1E21 75%,#1E1E21);background-position:0 3px,6px 0,0 6px,6px 3px,0 0,0 0;background-size:12px 12px}
.tl::-webkit-scrollbar{height:0}
.fade-in{animation:fadein .35s ease}
@keyframes fadein{from{opacity:.2}to{opacity:1}}
</style>
</helmet>
<div class="cf" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; color: #F4F4F5; font-family: 'Archivo', sans-serif;">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(165deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 30%, rgba(0,0,0,0.35) 100%);"></div>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px;">
<a href="Collection.dc.html" aria-label="Back to garage" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: #F4F4F5;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="text-align: center;">
<h1 style="margin: 0; font-size: 16px; font-weight: 900; font-stretch: 118%; letter-spacing: 0.04em;">NEW EDIT</h1>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A1AA; margin-top: 2px;">{{summary}}</div>
</div>
<a href="Create.dc.html" style="height: 40px; padding: 0 18px; border-radius: 999px; background: #E0241B; color: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 800; box-shadow: 0 8px 20px rgba(224,36,27,0.35);">Next</a>
</header>

<section aria-label="Preview" style="position: relative; margin-top: 8px; height: 320px; display: flex; align-items: center; justify-content: center;">
<div style="position: relative; width: {{frameW}}; height: {{frameH}}; border-radius: 16px; overflow: hidden; background: #000000; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.12);">
<sc-if value="{{hasClips}}" hint-placeholder-val="{{true}}">
<sc-if value="{{curIsVideo}}" hint-placeholder-val="{{false}}">
<video key="{{cur.id}}" src="{{cur.src}}" muted="{{yes}}" autoPlay="{{yes}}" loop="{{yes}}" playsInline="{{yes}}" style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
</sc-if>
<sc-if value="{{curIsImage}}" hint-placeholder-val="{{true}}">
<img key="{{cur.id}}" class="fade-in" src="{{cur.src}}" alt="Preview: {{cur.name}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{cur.pos}}; display: block; transform: scale({{zoom}}); transition: transform 0.1s linear;">
</sc-if>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.7) 100%);"></div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 14px;">
<div style="font-size: 10px; font-weight: 800; letter-spacing: 0.2em; color: #FF6F61;">{{subtitle}}</div>
<div style="font-size: 22px; font-weight: 900; font-stretch: 125%; font-style: italic; line-height: 1.05; word-break: break-word;">{{title}}</div>
</div>
<span style="position: absolute; top: 10px; right: 10px; font-size: 9px; font-weight: 900; font-stretch: 125%; font-style: italic; letter-spacing: 0.08em; color: rgba(255,255,255,0.75);">DEADLINE</span>
<button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 999px; background: rgba(10,10,11,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.25); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; opacity: {{playBtnOpacity}}; transition: opacity 0.2s;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{playIcon}}"></path></svg>
</button>
</sc-if>
<sc-if value="{{noClips}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; color: #A1A1AA; font-size: 13px;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6"></path></svg>
Add photos or videos to start your edit
</div>
</sc-if>
</div>
</section>

<div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 0;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;">{{timeNow}} <span style="color: #8B8B94;">/ {{timeTotal}}</span></span>
<div role="radiogroup" aria-label="Shape" style="padding: 3px; border-radius: 12px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 3px;">
<sc-for list="{{aspects}}" as="a" hint-placeholder-count="3">
<button role="radio" aria-checked="{{a.on}}" onClick="{{a.pick}}" style="height: 30px; padding: 0 11px; border-radius: 9px; border: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; background: {{a.bg}}; color: {{a.fg}};">{{a.label}}</button>
</sc-for>
</div>
</div>

<section aria-label="Timeline" style="position: relative; margin: 10px 12px 0; padding: 10px 0 10px; border-radius: 18px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,255,255,0.08); display: flex;">
<div aria-hidden="true" style="width: 34px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; color: #8B8B94;">
<span style="height: 16px;"></span>
<span style="height: 56px; margin-top: 6px; display: flex; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h18v14H3zM7 5v14M17 5v14"></path></svg></span>
<span style="height: 24px; margin-top: 6px; display: flex; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>
</div>
<div class="tl" style="flex-grow: 1; overflow-x: auto; overflow-y: hidden;">
<div style="position: relative; width: {{trackW}}; padding-right: 16px;">
<div style="height: 16px; display: flex; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #8B8B94;">
<sc-for list="{{ruler}}" as="r" hint-placeholder-count="7">
<span style="width: 50px; flex-shrink: 0; border-left: 1px solid rgba(255,255,255,0.14); padding-left: 3px; box-sizing: border-box;">{{r}}</span>
</sc-for>
</div>
<div style="display: flex; gap: 2px; margin-top: 6px; height: 56px;">
<sc-for list="{{clips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" aria-label="{{c.aria}}" style="position: relative; width: {{c.w}}; height: 56px; flex-shrink: 0; padding: 0; border: none; border-radius: 8px; overflow: hidden; background: #1A1A1D; box-shadow: {{c.ring}}; cursor: pointer;">
<sc-if value="{{c.isVideo}}" hint-placeholder-val="{{false}}">
<video src="{{c.src}}" muted="{{c.yes}}" preload="metadata" style="width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none;"></video>
</sc-if>
<sc-if value="{{c.isImage}}" hint-placeholder-val="{{true}}">
<img src="{{c.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: {{c.pos}}; display: block;">
</sc-if>
<span style="position: absolute; left: 4px; bottom: 3px; padding: 1px 4px; border-radius: 4px; background: rgba(10,10,11,0.7); font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: #FFFFFF;">{{c.label}}</span>
</button>
</sc-for>
</div>
<div style="margin-top: 6px; height: 24px; width: {{musicW}}; box-sizing: border-box; border-radius: 6px; background: rgba(125,184,255,0.12); border: 1px solid rgba(125,184,255,0.45); display: flex; align-items: center; gap: 2px; padding: 0 6px; overflow: hidden;">
<sc-for list="{{wave}}" as="h" hint-placeholder-count="60">
<span style="width: 3px; flex-shrink: 0; border-radius: 2px; background: #7DB8FF; height: {{h}};"></span>
</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; left: {{playheadX}}; top: 18px; bottom: 0; width: 2px; background: #FFFFFF; box-shadow: 0 0 8px rgba(255,255,255,0.6); pointer-events: none;">
<span style="position: absolute; left: -5px; top: -4px; width: 12px; height: 12px; border-radius: 3px; background: #FFFFFF;"></span>
</div>
</div>
</div>
</section>

<div aria-label="Selected clip" style="position: relative; margin: 10px 12px 0; padding: 8px 10px; border-radius: 16px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 6px;">
<div style="flex-grow: 1; min-width: 0; padding-left: 4px;">
<div style="font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #A1A1AA;">{{selHeading}}</div>
<div style="font-size: 13px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{selName}}</div>
</div>
<button onClick="{{shorter}}" disabled="{{noSel}}" aria-label="Make clip shorter" style="width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #F4F4F5; font-size: 18px; font-weight: 700; padding: 0;">−</button>
<span style="width: 34px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;">{{selDur}}</span>
<button onClick="{{longer}}" disabled="{{noSel}}" aria-label="Make clip longer" style="width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #F4F4F5; font-size: 18px; font-weight: 700; padding: 0;">+</button>
<button onClick="{{moveLeft}}" disabled="{{cantLeft}}" aria-label="Move clip earlier" style="width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #F4F4F5; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<button onClick="{{moveRight}}" disabled="{{cantRight}}" aria-label="Move clip later" style="width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #F4F4F5; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button onClick="{{remove}}" disabled="{{noSel}}" aria-label="Remove clip" style="width: 38px; height: 38px; border-radius: 10px; background: rgba(255,77,61,0.12); border: 1px solid rgba(255,77,61,0.4); color: #FF8A7D; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</div>

<div style="position: relative; margin: 10px 12px 0; display: flex; gap: 8px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
<label for="edit-title" style="font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #A1A1AA; padding-left: 4px;">TITLE ON VIDEO</label>
<input id="edit-title" value="{{title}}" onChange="{{onTitle}}" maxlength="28" placeholder="Type a title" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,255,255,0.14); color: #F4F4F5; font-size: 15px; font-weight: 700;">
</div>
<div style="width: 132px; display: flex; flex-direction: column; gap: 4px;">
<span id="motion-label" style="font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #A1A1AA; padding-left: 4px;">PHOTO MOTION</span>
<button onClick="{{toggleZoom}}" aria-pressed="{{zoomOn}}" aria-labelledby="motion-label" style="height: 44px; border-radius: 12px; background: {{zoomBg}}; border: {{zoomBorder}}; color: #F4F4F5; font-size: 13px; font-weight: 700;">{{zoomLabel}}</button>
</div>
</div>

<div style="position: relative; margin: 10px 12px 0; display: flex; gap: 8px;">
<label style="position: relative; flex-grow: 1; height: 52px; border-radius: 999px; background: #E0241B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px rgba(224,36,27,0.35), inset 0 1px 0 rgba(255,255,255,0.2); overflow: hidden;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add your photos or videos
<input type="file" multiple="{{yes}}" accept="image/*,video/*" onChange="{{onFiles}}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer;">
</label>
<sc-if value="{{hasSamples}}" hint-placeholder-val="{{true}}">
<button onClick="{{clearSamples}}" style="height: 52px; padding: 0 16px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); color: #F4F4F5; font-size: 13px; font-weight: 700;">Clear samples</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.nextId = 1;
    const b = '/_blob/';
    this.state = {
      aspect: '9:16',
      playing: false,
      t: 0,
      zoom: true,
      title: 'REVUELTO',
      sel: 's1',
      clips: [
        { id: 's1', src: b + 'd0ed9a1124b4be55c66020506d0952f5', pos: '55% 50%', type: 'image', dur: 3, name: 'Lamborghini Revuelto', sample: true },
        { id: 's2', src: b + '4c34a39ed7fc32822ce83f9e01f8d264', pos: '45% 60%', type: 'image', dur: 3, name: 'Ferrari SF90 Stradale', sample: true },
        { id: 's3', src: b + '7a1f38e951343777cdb82e6e2ecdffc1', pos: '40% 50%', type: 'image', dur: 3, name: 'McLaren 750S', sample: true },
        { id: 's4', src: b + '009516d94a7dcf61f3cbf171fac4271c', pos: '50% 55%', type: 'image', dur: 3, name: 'Porsche 911 GT3 RS', sample: true }
      ]
    };
  }
  componentWillUnmount() { this.stop(); }
  total(clips) { return clips.reduce((a, c) => a + c.dur, 0); }
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }
  play() {
    this.stop();
    const total = this.total(this.state.clips);
    if (!total) return;
    const start = this.state.t >= total ? 0 : this.state.t;
    this.setState({ playing: true, t: start });
    this.timer = setInterval(() => {
      const tot = this.total(this.state.clips);
      const next = this.state.t + 0.1;
      if (next >= tot) { this.stop(); this.setState({ playing: false, t: tot }); }
      else this.setState({ t: next });
    }, 100);
  }
  update(clips, extra) {
    const tot = this.total(clips);
    this.setState(Object.assign({ clips, t: Math.min(this.state.t, tot) }, extra || {}));
  }
  renderVals() {
    const s = this.state;
    const fmt = (sec) => { const x = Math.floor(sec); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
    const total = this.total(s.clips);
    let acc = 0, curIdx = 0;
    const starts = s.clips.map((c) => { const st = acc; acc += c.dur; return st; });
    s.clips.forEach((c, i) => { if (s.t >= starts[i]) curIdx = i; });
    const cur = s.clips[curIdx] || null;
    const within = cur ? Math.min(1, (s.t - starts[curIdx]) / cur.dur) : 0;
    const selIdx = s.clips.findIndex((c) => c.id === s.sel);
    const selClip = selIdx >= 0 ? s.clips[selIdx] : null;

    const clips = s.clips.map((c, i) => {
      const on = c.id === s.sel;
      return {
        ...c, yes: true,
        isVideo: c.type === 'video', isImage: c.type !== 'video',
        pos: c.pos || '50% 50%',
        w: Math.max(28, c.dur * 10 - 2) + 'px',
        label: (c.type === 'video' ? 'VID ' : '') + c.dur + 's',
        on: on ? 'true' : 'false',
        ring: on ? 'inset 0 0 0 2px #FF4D3D' : 'none',
        aria: (c.type === 'video' ? 'Video, ' : 'Photo, ') + c.name + ', ' + c.dur + ' seconds' + (on ? ', selected' : ''),
        pick: () => { this.stop(); this.setState({ sel: c.id, t: starts[i], playing: false }); }
      };
    });

    const swap = (a, b) => { const arr = s.clips.slice(); const tmp = arr[a]; arr[a] = arr[b]; arr[b] = tmp; this.update(arr); };
    const setDur = (d) => { if (!selClip) return; this.update(s.clips.map((c) => c.id === s.sel ? { ...c, dur: Math.max(1, Math.min(20, d)) } : c)); };

    const sizes = { '9:16': ['180px', '320px'], '1:1': ['300px', '300px'], '16:9': ['350px', '197px'] };
    const aspects = ['9:16', '1:1', '16:9'].map((label) => ({
      label, on: s.aspect === label ? 'true' : 'false',
      bg: s.aspect === label ? '#F4F4F5' : 'transparent',
      fg: s.aspect === label ? '#0A0A0B' : '#A1A1AA',
      pick: () => this.setState({ aspect: label })
    }));
    const secs = Math.max(30, Math.ceil(total / 5) * 5);
    const ruler = [];
    for (let x = 0; x <= secs; x += 5) ruler.push(x + 's');
    const trackPx = Math.max(total * 10, 300);
    const waveCount = Math.max(10, Math.floor((total * 10 - 12) / 5));
    const wave = Array.from({ length: waveCount }, (_, i) => Math.round(5 + 13 * Math.abs(Math.sin(i * 0.7) * Math.cos(i * 0.23))) + 'px');

    return {
      yes: true,
      clips, aspects, ruler, wave,
      cur: cur || { id: 'none', src: '', name: '', pos: '50% 50%' },
      hasClips: s.clips.length > 0,
      noClips: s.clips.length === 0,
      curIsVideo: !!cur && cur.type === 'video',
      curIsImage: !!cur && cur.type !== 'video',
      zoom: s.zoom && cur && cur.type !== 'video' ? (1 + 0.08 * within).toFixed(3) : '1',
      title: s.title,
      subtitle: 'SPOTTED ON DEADLINE',
      summary: fmt(total) + ' · ' + s.clips.length + (s.clips.length === 1 ? ' clip' : ' clips'),
      frameW: sizes[s.aspect][0],
      frameH: sizes[s.aspect][1],
      timeNow: fmt(s.t),
      timeTotal: fmt(total),
      trackW: trackPx + 'px',
      musicW: Math.max(40, total * 10 - 2) + 'px',
      playheadX: Math.min(s.t * 10, Math.max(0, total * 10 - 2)) + 'px',
      playIcon: s.playing ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M7 4l13 8-13 8z',
      playLabel: s.playing ? 'Pause' : 'Play',
      playBtnOpacity: s.playing ? '0.35' : '1',
      togglePlay: () => { if (s.playing) { this.stop(); this.setState({ playing: false }); } else this.play(); },

      selHeading: selClip ? 'CLIP ' + (selIdx + 1) + ' OF ' + s.clips.length : 'NO CLIP SELECTED',
      selName: selClip ? selClip.name : 'Tap a clip on the timeline',
      selDur: selClip ? selClip.dur + 's' : '–',
      noSel: !selClip,
      cantLeft: !selClip || selIdx === 0,
      cantRight: !selClip || selIdx === s.clips.length - 1,
      shorter: () => selClip && setDur(selClip.dur - 1),
      longer: () => selClip && setDur(selClip.dur + 1),
      moveLeft: () => { if (selIdx > 0) swap(selIdx, selIdx - 1); },
      moveRight: () => { if (selIdx >= 0 && selIdx < s.clips.length - 1) swap(selIdx, selIdx + 1); },
      remove: () => {
        if (!selClip) return;
        this.stop();
        const arr = s.clips.filter((c) => c.id !== s.sel);
        const nextSel = arr[Math.min(selIdx, arr.length - 1)];
        this.update(arr, { sel: nextSel ? nextSel.id : null, playing: false });
      },

      onTitle: (e) => this.setState({ title: e.target.value.toUpperCase() }),
      zoomOn: s.zoom ? 'true' : 'false',
      zoomLabel: s.zoom ? 'Slow zoom' : 'Still',
      zoomBg: s.zoom ? 'rgba(255,77,61,0.14)' : 'rgba(16,16,19,0.94)',
      zoomBorder: s.zoom ? '1px solid rgba(255,77,61,0.5)' : '1px solid rgba(255,255,255,0.14)',
      toggleZoom: () => this.setState({ zoom: !s.zoom }),

      hasSamples: s.clips.some((c) => c.sample),
      clearSamples: () => {
        this.stop();
        const arr = s.clips.filter((c) => !c.sample);
        this.update(arr, { sel: arr.length ? arr[0].id : null, playing: false, t: 0 });
      },
      onFiles: (e) => {
        const files = Array.prototype.slice.call((e.target && e.target.files) || []);
        if (!files.length) return;
        const added = files.map((f) => {
          const isVid = (f.type || '').indexOf('video') === 0;
          return {
            id: 'u' + (this.nextId++),
            src: URL.createObjectURL(f),
            type: isVid ? 'video' : 'image',
            dur: isVid ? 5 : 3,
            name: (f.name || 'Your clip').replace(/\.[^.]+$/, '')
          };
        });
        this.update(this.state.clips.concat(added), { sel: added[0].id });
        try { e.target.value = ''; } catch (err) {}
      }
    };
  }
}
</script>
</body>
</html>
