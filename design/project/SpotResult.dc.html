<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="padding: 12px 14px; background: rgba(16,16,19,0.94); display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #A1A1AA;">{{s.label}}</span>

<div style="height: 3px; margin-top: 4px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden;"><div style="height: 100%; border-radius: 999px; background: linear-gradient(90deg, #E0241B, #FF6A4D); width: {{s.pct}};"></div></div>
</div>
</sc-for>
</section>

<span style="width: 18px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12);"></span>
</div>
</div>
<a href="Leaderboard.dc.html" style="padding: 12px 14px; display: flex; align-items: center; gap: 12px; color: #F4F4F5;">
<div style="flex-grow: 1;">
<div style="font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #A1A1AA;">OVERALL RANKING</div>
<div style="font-size: 13px; font-weight: 600; margin-top: 3px;">Out of 1,240 cars in DEADLINE</div>
</div>

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B8B94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px 0; font-size: 12px; color: #8B8B94;">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path></svg>

<a href="Create.dc.html" style="flex-grow: 1; height: 54px; border-radius: 999px; background: #E0241B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; box-shadow: 0 10px 24px rgba(224,36,27,0.35), inset 0 1px 0 rgba(255,255,255,0.2);">Share to feed</a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"units":{"editor":"enum","options":["mph","km/h"],"default":"mph"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kmh = (this.props.units ?? 'mph') === 'km/h';
    return {
      stats: [
        { label: 'POWER', value: '1,001', unit: 'hp', pct: '88%' },
        { label: kmh ? '0-100 KM/H' : '0-60 MPH', value: '2.5', unit: 's', pct: '94%' },
        { label: 'TOP SPEED', value: kmh ? '350' : '217', unit: kmh ? 'km/h' : 'mph', pct: '86%' },
        { label: 'VALUE', value: '£500k', unit: '', pct: '82%' }
      ]
    };
  }
}
</script>
