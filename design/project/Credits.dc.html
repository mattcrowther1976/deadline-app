<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo credits</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0A0B}
a{color:#FF6F61;text-decoration:none}a:hover{color:#FF8A7D;text-decoration:underline}
.cf{background-color:#0E0E10;background-image:linear-gradient(27deg,#141416 3px,transparent 3px),linear-gradient(207deg,#141416 3px,transparent 3px),linear-gradient(27deg,#1C1C1F 3px,transparent 3px),linear-gradient(207deg,#1C1C1F 3px,transparent 3px),linear-gradient(90deg,#161618 6px,transparent 6px),linear-gradient(#18181B 25%,#131315 25%,#131315 50%,transparent 50%,transparent 75%,#1E1E21 75%,#1E1E21);background-position:0 3px,6px 0,0 6px,6px 3px,0 0,0 0;background-size:12px 12px}
</style>
</helmet>
<div class="cf" style="width: 1040px; height: 1000px; box-sizing: border-box; padding: 56px 48px; color: #F4F4F5; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column; gap: 22px;">
<h1 style="margin: 0; font-size: 28px; font-weight: 900; font-stretch: 125%; font-style: italic;">PHOTO CREDITS</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #A1A1AA;">Prototype photography from Wikimedia Commons, used under Creative Commons licences or in the public domain. Photos appear cropped.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; row-gap: 16px;">
<sc-for list="{{credits}}" as="c" hint-placeholder-count="20">
<div style="display: flex; gap: 14px; align-items: center;">
<img src="{{c.img}}" alt="" style="width: 96px; height: 60px; border-radius: 10px; object-fit: cover; display: block;">
<div style="display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 15px; font-weight: 800;">{{c.car}}</span>
<span style="font-size: 13px; color: #D4D4D8;">{{c.author}} · {{c.licence}}</span>
<a href="{{c.url}}" style="font-family: 'JetBrains Mono', monospace; font-size: 11px;">View on Wikimedia Commons</a>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":1000}}'>

        { car: "Horacio Pagani", author: "RizwanRzaKhan", licence: "CC BY-SA 4.0", img: '/_blob/b7da6155bc525d2a1dc6454f200288cf', url: base + "Horacio-Pagani_(cropped).jpg" },
        { car: "Christian von Koenigsegg", author: "Marcel Giger", licence: "CC BY-SA 4.0", img: '/_blob/856517ec16a0e2eecb8b7410a5ed391a', url: base + "40._St.Gallen_Symposium-Christian_von_Koenigsegg-HSGN_028-01971.JPG" },

        { car: "Lamborghini 350 GT", author: "MrWalkr", licence: "CC BY-SA 4.0", img: '/_blob/f9107fc93b9c02d328fb8f209d7a4ce5', url: base + "1965_Lamborghini_350_GT_HCC24.jpg" },

        { car: "Lamborghini LM002", author: "MrWalkr", licence: "CC BY-SA 4.0", img: '/_blob/9dbbeba5d81149470d9676e83aa30a71', url: base + "1991_Lamborghini_LM002_LC_23.jpg" },

</script>
</body>
</html>
