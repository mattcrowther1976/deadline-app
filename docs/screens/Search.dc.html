<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0A0B}
a{color:#FF4D3D;text-decoration:none}a:hover{color:#FF6F61}
button,input{font-family:inherit}
input::placeholder{color:#8B8B94}
input:focus{outline:none}
.cf{background-color:#0E0E10;background-image:linear-gradient(27deg,#141416 3px,transparent 3px),linear-gradient(207deg,#141416 3px,transparent 3px),linear-gradient(27deg,#1C1C1F 3px,transparent 3px),linear-gradient(207deg,#1C1C1F 3px,transparent 3px),linear-gradient(90deg,#161618 6px,transparent 6px),linear-gradient(#18181B 25%,#131315 25%,#131315 50%,transparent 50%,transparent 75%,#1E1E21 75%,#1E1E21);background-position:0 3px,6px 0,0 6px,6px 3px,0 0,0 0;background-size:12px 12px}
</style>
</helmet>
<div class="cf" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; color: #F4F4F5; font-family: 'Archivo', sans-serif;">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(165deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 30%, rgba(0,0,0,0.35) 100%);"></div>

<div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 20px 0;">
<div style="flex-grow: 1; height: 48px; box-sizing: border-box; border-radius: 999px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,77,61,0.6); display: flex; align-items: center; gap: 10px; padding: 0 14px;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search DEADLINE</label>
<input id="q" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Cars, spotters, #tags" style="flex-grow: 1; min-width: 0; height: 100%; background: none; border: none; color: #F4F4F5; font-size: 16px; font-weight: 600;">
<sc-if value="{{hasQ}}" hint-placeholder-val="{{true}}">
<button onClick="{{clear}}" aria-label="Clear search" style="width: 28px; height: 28px; border-radius: 999px; background: rgba(255,255,255,0.12); border: none; color: #F4F4F5; display: flex; align-items: center; justify-content: center; padding: 0;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>
</sc-if>
</div>
<a href="Main.dc.html" style="font-size: 15px; font-weight: 600; color: #D4D4D8;">Cancel</a>
</div>

<sc-if value="{{hasQ}}" hint-placeholder-val="{{true}}">
<div role="tablist" aria-label="Result type" style="position: relative; display: flex; gap: 8px; padding: 14px 20px 4px; overflow: hidden;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 34px; padding: 0 14px; flex-shrink: 0; border-radius: 999px; font-size: 13px; font-weight: 700; background: {{t.bg}}; color: {{t.fg}}; border: {{t.border}};">{{t.label}}</button>
</sc-for>
</div>

<sc-if value="{{showCars}}" hint-placeholder-val="{{true}}">
<h2 style="position: relative; margin: 14px 20px 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #A1A1AA;">CARS</h2>
<div style="position: relative; margin: 0 20px; border-radius: 18px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,255,255,0.08); overflow: hidden;">
<a href="SpotResult.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #F4F4F5; border-bottom: 1px solid rgba(255,255,255,0.06);">
<img src="/_blob/d0ed9a1124b4be55c66020506d0952f5" alt="" style="width: 76px; height: 50px; border-radius: 10px; object-fit: cover; object-position: 55% 50%; display: block;">
<div style="flex-grow: 1;">
<div style="font-size: 15px; font-weight: 800;"><span style="color: #FF6F61;">Lambo</span>rghini Revuelto</div>
<div style="font-size: 11px; color: #86EFAC; margin-top: 3px;">In your garage · Legendary</div>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1AA;">#14</span>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #F4F4F5; border-bottom: 1px solid rgba(255,255,255,0.06);">
<div style="width: 76px; height: 50px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #8B8B94;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
</div>
<div style="flex-grow: 1;">
<div style="font-size: 15px; font-weight: 800;"><span style="color: #FF6F61;">Lambo</span>rghini Aventador SVJ</div>
<div style="font-size: 11px; color: #A1A1AA; margin-top: 3px;">Not spotted yet · Mythic · 3 near you</div>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1AA;">#6</span>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #F4F4F5;">
<div style="width: 76px; height: 50px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #8B8B94;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
</div>
<div style="flex-grow: 1;">
<div style="font-size: 15px; font-weight: 800;"><span style="color: #FF6F61;">Lambo</span>rghini Huracán STO</div>
<div style="font-size: 11px; color: #A1A1AA; margin-top: 3px;">Not spotted yet · Epic</div>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1AA;">#27</span>
</a>
</div>
</sc-if>

<sc-if value="{{showPeople}}" hint-placeholder-val="{{true}}">
<h2 style="position: relative; margin: 18px 20px 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #A1A1AA;">SPOTTERS</h2>
<div style="position: relative; margin: 0 20px; display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{people}}" as="p" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 16px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,255,255,0.08);">
<div style="width: 40px; height: 40px; border-radius: 999px; overflow: hidden; border: 2px solid rgba(255,255,255,0.2); box-sizing: border-box;"><img src="{{p.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
<div style="flex-grow: 1;">
<div style="font-size: 14px; font-weight: 800;">{{p.name}}</div>
<div style="font-size: 11px; color: #A1A1AA; margin-top: 2px;">Lvl {{p.level}} · {{p.spots}} spots</div>
</div>
<button onClick="{{p.toggle}}" style="height: 34px; padding: 0 14px; border-radius: 999px; background: {{p.bg}}; border: {{p.border}}; color: {{p.fg}}; font-size: 12px; font-weight: 800;">{{p.label}}</button>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showPosts}}" hint-placeholder-val="{{true}}">
<h2 style="position: relative; margin: 18px 20px 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #A1A1AA;">POSTS · #LAMBO</h2>
<div style="position: relative; margin: 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
<img src="/_blob/d0ed9a1124b4be55c66020506d0952f5" alt="Post: Revuelto" style="width: 100%; height: 96px; border-radius: 10px; object-fit: cover; object-position: 55% 50%; display: block;">
<img src="/_blob/d0ed9a1124b4be55c66020506d0952f5" alt="Post: Revuelto side" style="width: 100%; height: 96px; border-radius: 10px; object-fit: cover; object-position: 90% 50%; display: block;">
<img src="/_blob/d0ed9a1124b4be55c66020506d0952f5" alt="Post: Revuelto wheel" style="width: 100%; height: 96px; border-radius: 10px; object-fit: cover; object-position: 75% 80%; display: block;">
</div>
</sc-if>
</sc-if>

<sc-if value="{{noQ}}" hint-placeholder-val="{{false}}">
<h2 style="position: relative; margin: 20px 20px 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #A1A1AA;">RECENT</h2>
<div style="position: relative; margin: 0 20px; display: flex; flex-direction: column;">
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
<button onClick="{{r.pick}}" style="height: 46px; display: flex; align-items: center; gap: 12px; background: none; border: none; border-bottom: 1px solid rgba(255,255,255,0.06); color: #F4F4F5; font-size: 15px; font-weight: 600; text-align: left; padding: 0;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B8B94" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
{{r.label}}
</button>
</sc-for>
</div>
<h2 style="position: relative; margin: 22px 20px 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #A1A1AA;">TRENDING NEAR YOU</h2>
<div style="position: relative; margin: 0 20px; display: flex; gap: 8px; flex-wrap: wrap;">
<sc-for list="{{trending}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #E4E4E7; font-size: 13px; font-weight: 700;">{{t.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'lambo', tab: 'all', following: { 'lambo_luke': false, 'lisa.lambo': false } };
  }
  renderVals() {
    const s = this.state;
    const hasQ = s.q.trim().length > 0;
    const tabs = [['all', 'All'], ['cars', 'Cars'], ['people', 'Spotters'], ['posts', 'Posts']].map(([id, label]) => ({
      label, on: s.tab === id ? 'true' : 'false',
      bg: s.tab === id ? '#F4F4F5' : 'rgba(255,255,255,0.05)',
      fg: s.tab === id ? '#0A0A0B' : '#D4D4D8',
      border: s.tab === id ? '1px solid #F4F4F5' : '1px solid rgba(255,255,255,0.12)',
      pick: () => this.setState({ tab: id })
    }));
    const people = [
      { name: 'lambo_luke', level: 18, spots: 41, img: '/_blob/d0ed9a1124b4be55c66020506d0952f5' },
      { name: 'lisa.lambo', level: 11, spots: 23, img: '/_blob/009516d94a7dcf61f3cbf171fac4271c' }
    ].map((p) => {
      const on = !!s.following[p.name];
      return {
        ...p,
        label: on ? 'Following' : 'Follow',
        bg: on ? 'rgba(255,255,255,0.06)' : '#E0241B',
        fg: '#FFFFFF',
        border: on ? '1px solid rgba(255,255,255,0.2)' : '1px solid #E0241B',
        toggle: () => this.setState({ following: { ...s.following, [p.name]: !on } })
      };
    });
    const setQ = (q) => () => this.setState({ q, tab: 'all' });
    return {
      q: s.q, hasQ, noQ: !hasQ, tabs, people,
      onQ: (e) => this.setState({ q: e.target.value }),
      clear: () => this.setState({ q: '' }),
      showCars: s.tab === 'all' || s.tab === 'cars',
      showPeople: s.tab === 'all' || s.tab === 'people',
      showPosts: s.tab === 'all' || s.tab === 'posts',
      recent: ['lambo', 'McLaren 750S', '@jamie_spots'].map((label) => ({ label, pick: setQ(label) })),
      trending: ['#DailyChallenge', 'Ferrari SF90', '#V12', 'Deansgate', 'Pagani'].map((label) => ({ label, pick: setQ(label) }))
    };
  }
}
</script>
</body>
</html>
