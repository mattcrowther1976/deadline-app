<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0A0B}
a{color:#FF4D3D;text-decoration:none}a:hover{color:#FF6F61}
button{font-family:inherit}
.cf{background-color:#0E0E10;background-image:linear-gradient(27deg,#141416 3px,transparent 3px),linear-gradient(207deg,#141416 3px,transparent 3px),linear-gradient(27deg,#1C1C1F 3px,transparent 3px),linear-gradient(207deg,#1C1C1F 3px,transparent 3px),linear-gradient(90deg,#161618 6px,transparent 6px),linear-gradient(#18181B 25%,#131315 25%,#131315 50%,transparent 50%,transparent 75%,#1E1E21 75%,#1E1E21);background-position:0 3px,6px 0,0 6px,6px 3px,0 0,0 0;background-size:12px 12px}
.stat:hover{background:rgba(255,77,61,0.1) !important}
.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.list::-webkit-scrollbar{width:0}
</style>
</helmet>
<div class="cf" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; color: #F4F4F5; font-family: 'Archivo', sans-serif;">

<div style="position: relative; height: 140px;">
<img src="/_blob/d0ed9a1124b4be55c66020506d0952f5" alt="Best spot: white Lamborghini Revuelto" style="width: 100%; height: 100%; object-fit: cover; object-position: 55% 45%; display: block;">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.05) 40%, rgba(14,14,16,0.95) 100%);"></div>
<div style="position: absolute; top: 12px; left: 16px; right: 12px; display: flex; align-items: center; justify-content: space-between;">
<span style="font-size: 14px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,0.6);">@maxspots</span>
<button aria-label="Settings" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: rgba(10,10,11,0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; color: #F4F4F5; padding: 0;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
</button>
</div>
</div>

<section style="position: relative; margin-top: -36px; padding: 0 20px; display: flex; align-items: flex-end; gap: 14px;">
<div style="position: relative; width: 80px; height: 80px; flex-shrink: 0;">
<div style="width: 80px; height: 80px; box-sizing: border-box; border-radius: 999px; padding: 3px; background: conic-gradient(#E0241B 0 78%, rgba(255,255,255,0.14) 78% 100%);">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 999px; border: 3px solid #0E0E10; background: #2A2A31; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; font-stretch: 125%;">MT</div>
</div>
<span style="position: absolute; right: -4px; bottom: 0; padding: 3px 8px; border-radius: 999px; background: #E0241B; color: #FFFFFF; font-size: 11px; font-weight: 900; border: 3px solid #0E0E10;">12</span>
</div>
<div style="flex-grow: 1; padding-bottom: 4px;">
<div style="font-size: 22px; font-weight: 900; font-stretch: 125%; line-height: 1.1;">Max Turner</div>
<div style="font-size: 12px; color: #A1A1AA; margin-top: 3px;">Street spotter · Manchester · 48 spots</div>
</div>
</section>

<section aria-label="Your numbers" style="position: relative; margin: 14px 20px 0; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: rgba(255,255,255,0.1);">
<button class="stat" onClick="{{openFollowers}}" aria-label="1,284 followers. See which posts got you the most followers" style="padding: 10px 0 9px; border: none; background: rgba(16,16,19,0.94); color: #F4F4F5; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;">1,284</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 800; letter-spacing: 0.14em; color: #A1A1AA;">FOLLOWERS <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FF6F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</button>
<button class="stat" onClick="{{openLikes}}" aria-label="{{likesAria}}" style="padding: 10px 0 9px; border: none; background: rgba(16,16,19,0.94); color: #F4F4F5; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;">
<span style="display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;"><svg width="15" height="15" viewBox="0 0 24 24" fill="#FF4D3D" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>{{totalLikes}}</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 800; letter-spacing: 0.14em; color: #A1A1AA;">TOTAL LIKES <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FF6F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</button>
<div style="padding: 10px 0 9px; background: rgba(16,16,19,0.94); display: flex; flex-direction: column; align-items: center; gap: 3px;">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;">{{postCount}}</span>
<span style="font-size: 9px; font-weight: 800; letter-spacing: 0.14em; color: #A1A1AA;">POSTS</span>
</div>
</section>

<div style="position: relative; display: flex; gap: 8px; padding: 12px 20px 0;">
<button style="flex-grow: 1; height: 38px; border-radius: 999px; background: #F4F4F5; border: none; color: #0A0A0B; font-size: 13px; font-weight: 800;">Edit profile</button>
<button style="flex-grow: 1; height: 38px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); color: #F4F4F5; font-size: 13px; font-weight: 700;">Share profile</button>
</div>

<div role="tablist" aria-label="Profile sections" style="position: relative; display: flex; gap: 22px; padding: 12px 20px 8px; border-bottom: 1px solid rgba(255,255,255,0.08);">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="background: none; border: none; padding: 6px 0; color: {{t.fg}}; font-size: 14px; font-weight: 800; border-bottom: 2px solid {{t.line}};">{{t.label}}</button>
</sc-for>
</div>

<sc-if value="{{showGrid}}" hint-placeholder-val="{{true}}">
<div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 2px 0 0;">
<sc-for list="{{gridPosts}}" as="g" hint-placeholder-count="9">
<div role="img" aria-label="{{g.aria}}" style="position: relative; height: 150px; overflow: hidden; background: #111113;">
<img src="{{g.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: {{g.pos}}; display: block;">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.7) 100%);"></div>
<sc-if value="{{g.isEdit}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 6px; left: 6px; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: #E0241B; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;"><svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>{{g.dur}}</span>
</sc-if>
<span style="position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg>{{g.likesShort}}</span>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showBadges}}" hint-placeholder-val="{{false}}">
<div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 20px 0;">
<sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
<div style="height: 86px; box-sizing: border-box; border-radius: 16px; background: rgba(16,16,19,0.94); border: 1px solid {{b.edge}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; opacity: {{b.opacity}};">
<div style="width: 38px; height: 38px; border-radius: 12px; background: {{b.bg}}; color: {{b.color}}; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"></path></svg>
</div>
<span style="font-size: 11px; font-weight: 700; text-align: center;">{{b.label}}</span>
</div>
</sc-for>
</div>
<div style="position: relative; margin: 14px 20px 0; display: flex; align-items: center; justify-content: space-between;">
<span id="units-label" style="font-size: 14px; font-weight: 600;">Speed units</span>
<div role="radiogroup" aria-labelledby="units-label" style="padding: 3px; border-radius: 12px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 3px;">
<sc-for list="{{units}}" as="u" hint-placeholder-count="2">
<button role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="height: 34px; padding: 0 14px; border-radius: 9px; border: none; font-size: 13px; font-weight: 700; background: {{u.bg}}; color: {{u.fg}};">{{u.label}}</button>
</sc-for>
</div>
</div>
</sc-if>

<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 88px;">
<dc-import name="TabBar" active="profile" hint-size="390px,88px"></dc-import>
</div>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 10;">
<button onClick="{{closeSheet}}" aria-label="Close top posts" style="position: absolute; inset: 0; width: 100%; height: 100%; border: none; padding: 0; background: rgba(0,0,0,0.62); cursor: pointer;"></button>
<section role="dialog" aria-modal="true" aria-label="Your top posts" class="cf sheet" style="position: absolute; left: 0; right: 0; bottom: 0; height: 720px; box-sizing: border-box; padding: 10px 16px 0; border-top-left-radius: 28px; border-top-right-radius: 28px; border-top: 1px solid rgba(255,255,255,0.14); box-shadow: 0 -24px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column;">
<div style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.2);"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 4px 0;">
<h2 style="margin: 0; font-size: 20px; font-weight: 900; font-stretch: 125%; font-style: italic;">YOUR TOP POSTS</h2>
<button onClick="{{closeSheet}}" aria-label="Close" style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #F4F4F5; display: flex; align-items: center; justify-content: center; padding: 0;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>
</div>

<div role="radiogroup" aria-label="Rank posts by" style="margin-top: 12px; padding: 4px; border-radius: 14px; background: rgba(16,16,19,0.94); border: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="height: 40px; border-radius: 10px; border: none; font-size: 13px; font-weight: 800; background: {{m.bg}}; color: {{m.fg}}; display: flex; align-items: center; justify-content: center; gap: 6px;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
{{m.label}}
</button>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 12px 4px 8px; font-size: 12px; color: #A1A1AA;">
<span>{{sheetSummary}}</span>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em;">MOST → LEAST</span>
</div>

<ol class="list" style="list-style: none; margin: 0; padding: 0 0 24px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{ranked}}" as="r" hint-placeholder-count="9">
<li style="display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 16px; background: rgba(16,16,19,0.94); border: 1px solid {{r.edge}};">
<span style="width: 26px; flex-shrink: 0; text-align: center; font-size: 18px; font-weight: 900; font-stretch: 125%; font-style: italic; color: {{r.rankColor}};">{{r.rank}}</span>
<div style="position: relative; width: 52px; height: 52px; flex-shrink: 0; border-radius: 10px; overflow: hidden;">
<img src="{{r.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: {{r.pos}}; display: block;">
<sc-if value="{{r.isEdit}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 3px; bottom: 3px; width: 16px; height: 16px; border-radius: 999px; background: #E0241B; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="7" height="7" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg></span>
</sc-if>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
<div style="font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.title}}</div>
<div style="font-size: 11px; color: #A1A1AA;">{{r.kind}} · {{r.when}}</div>
<div style="height: 4px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden;"><div style="height: 100%; border-radius: 999px; background: {{barColor}}; width: {{r.pct}};"></div></div>
</div>
<div style="flex-shrink: 0; text-align: right;">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700;">{{r.value}}</div>
<div style="font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #A1A1AA;">{{metricUnit}}</div>
</div>
</li>
</sc-for>
</ol>
</section>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheet":{"editor":"enum","options":["closed","followers","likes"],"default":"closed"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const sh = props.sheet ?? 'closed';
    this.state = { units: 'mph', tab: 'all', sheet: sh === 'closed' ? null : sh };
  }
  componentDidUpdate(prev) {
    if (prev.sheet !== this.props.sheet && this.props.sheet) this.setState({ sheet: this.props.sheet === 'closed' ? null : this.props.sheet });
  }
  renderVals() {
    const s = this.state;
    const b = '/_blob/';
    const n = (x) => x.toLocaleString('en-GB');
    const short = (x) => x >= 1000 ? (x / 1000).toFixed(1).replace('.0', '') + 'k' : String(x);
    const posts = [
      { id: 'e1', title: 'Manchester night run', kind: 'Edit', dur: '0:34', when: '2 days ago', img: b + 'd0ed9a1124b4be55c66020506d0952f5', pos: '55% 50%', likes: 2140, followers: 212 },
      { id: 'p1', title: 'Lamborghini Revuelto', kind: 'Photo', when: '3 days ago', img: b + 'd0ed9a1124b4be55c66020506d0952f5', pos: '85% 45%', likes: 1580, followers: 96 },
      { id: 'e2', title: 'Supercar Sunday', kind: 'Edit', dur: '0:21', when: '1 week ago', img: b + '4c34a39ed7fc32822ce83f9e01f8d264', pos: '45% 60%', likes: 1320, followers: 148 },
      { id: 'e3', title: 'Papaya week', kind: 'Edit', dur: '0:18', when: '1 week ago', img: b + '7a1f38e951343777cdb82e6e2ecdffc1', pos: '40% 50%', likes: 1050, followers: 173 },
      { id: 'p2', title: 'Ferrari SF90 Stradale', kind: 'Photo', when: '2 weeks ago', img: b + '4c34a39ed7fc32822ce83f9e01f8d264', pos: '90% 50%', likes: 980, followers: 41 },
      { id: 'p4', title: 'Aston Martin Vanquish', kind: 'Photo', when: '2 weeks ago', img: b + '70522fdf14052f038999461a17d193a4', pos: '55% 55%', likes: 720, followers: 35 },
      { id: 'p5', title: 'McLaren 750S', kind: 'Photo', when: '3 weeks ago', img: b + '7a1f38e951343777cdb82e6e2ecdffc1', pos: '88% 60%', likes: 700, followers: 19 },
      { id: 'p3', title: 'Porsche 911 GT3 RS', kind: 'Photo', when: '3 weeks ago', img: b + '009516d94a7dcf61f3cbf171fac4271c', pos: '50% 55%', likes: 610, followers: 22 },
      { id: 'e4', title: 'Stealth mode', kind: 'Edit', dur: '0:12', when: '1 month ago', img: b + '70522fdf14052f038999461a17d193a4', pos: '15% 50%', likes: 530, followers: 58 }
    ];
    const totalLikes = posts.reduce((a, p) => a + p.likes, 0);
    const fromPosts = posts.reduce((a, p) => a + p.followers, 0);

    const tabs = [['all', 'All posts'], ['edits', 'Edits'], ['photos', 'Photos'], ['badges', 'Badges']].map(([id, label]) => ({
      label, on: s.tab === id ? 'true' : 'false',
      fg: s.tab === id ? '#F4F4F5' : '#8B8B94',
      line: s.tab === id ? '#FF4D3D' : 'transparent',
      pick: () => this.setState({ tab: id })
    }));
    const gridPosts = posts
      .filter((p) => s.tab === 'all' || (s.tab === 'edits' && p.kind === 'Edit') || (s.tab === 'photos' && p.kind === 'Photo'))
      .map((p) => ({ ...p, isEdit: p.kind === 'Edit', likesShort: short(p.likes), aria: p.kind + ': ' + p.title + ', ' + n(p.likes) + ' likes' }));

    const mode = s.sheet || 'followers';
    const key = mode === 'likes' ? 'likes' : 'followers';
    const sorted = posts.slice().sort((a, c) => c[key] - a[key]);
    const max = sorted.length ? sorted[0][key] : 1;
    const medal = ['#FFC53D', '#D6DAE0', '#E09A5F'];
    const ranked = sorted.map((p, i) => ({
      ...p,
      rank: String(i + 1),
      rankColor: medal[i] || '#8B8B94',
      edge: i === 0 ? 'rgba(255,197,61,0.45)' : 'rgba(255,255,255,0.08)',
      isEdit: p.kind === 'Edit',
      kind: p.kind === 'Edit' ? 'Edit ' + p.dur : 'Photo',
      value: (key === 'followers' ? '+' : '') + n(p[key]),
      pct: Math.round((p[key] / max) * 100) + '%'
    }));
    const modes = [
      ['followers', 'Most followers', 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM19 8v6M22 11h-6'],
      ['likes', 'Most likes', 'M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z']
    ].map(([id, label, icon]) => ({
      label, icon, on: mode === id ? 'true' : 'false',
      bg: mode === id ? '#E0241B' : 'transparent',
      fg: mode === id ? '#FFFFFF' : '#A1A1AA',
      pick: () => this.setState({ sheet: id })
    }));

    const earned = (label, d, color, bg) => ({ label, d, color, bg, edge: 'rgba(255,255,255,0.1)', opacity: '1' });
    const locked = (label) => ({ label, d: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4', color: '#8B8B94', bg: 'rgba(255,255,255,0.05)', edge: 'rgba(255,255,255,0.06)', opacity: '0.7' });
    const badges = [
      earned('First spot', 'M5 12l5 5L20 7', '#4ADE80', 'rgba(74,222,128,0.12)'),
      earned('V12 hunter', 'M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-9.5z', '#FF6F61', 'rgba(255,77,61,0.14)'),
      earned('Night owl', 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z', '#C39BFF', 'rgba(195,155,255,0.14)'),
      earned('Road trip', 'M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z', '#7DB8FF', 'rgba(125,184,255,0.14)'),
      locked('Hypercar club'),
      locked('Top 10 city')
    ];
    const units = [['mph', 'mph'], ['kmh', 'km/h']].map(([id, label]) => ({
      label, on: s.units === id ? 'true' : 'false',
      bg: s.units === id ? '#F4F4F5' : 'transparent',
      fg: s.units === id ? '#0A0A0B' : '#A1A1AA',
      pick: () => this.setState({ units: id })
    }));

    return {
      tabs, gridPosts, badges, units, modes, ranked,
      totalLikes: n(totalLikes),
      likesAria: n(totalLikes) + ' total likes. See which posts got the most likes',
      postCount: String(posts.length),
      showGrid: s.tab !== 'badges',
      showBadges: s.tab === 'badges',
      sheetOpen: !!s.sheet,
      openFollowers: () => this.setState({ sheet: 'followers' }),
      openLikes: () => this.setState({ sheet: 'likes' }),
      closeSheet: () => this.setState({ sheet: null }),
      sheetSummary: key === 'followers' ? n(fromPosts) + ' of your 1,284 followers came from posts' : n(totalLikes) + ' likes across ' + posts.length + ' posts',
      metricUnit: key === 'followers' ? 'FOLLOWERS' : 'LIKES',
      barColor: key === 'followers' ? 'linear-gradient(90deg, #7DB8FF, #B6D8FF)' : 'linear-gradient(90deg, #E0241B, #FF6A4D)'
    };
  }
}
</script>
