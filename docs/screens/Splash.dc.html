<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0A0A0B}
a{color:#FF4D3D;text-decoration:none}a:hover{color:#FF6F61}
button{font-family:inherit}
.cf{background-color:#0E0E10;background-image:linear-gradient(27deg,#141416 3px,transparent 3px),linear-gradient(207deg,#141416 3px,transparent 3px),linear-gradient(27deg,#1C1C1F 3px,transparent 3px),linear-gradient(207deg,#1C1C1F 3px,transparent 3px),linear-gradient(90deg,#161618 6px,transparent 6px),linear-gradient(#18181B 25%,#131315 25%,#131315 50%,transparent 50%,transparent 75%,#1E1E21 75%,#1E1E21);background-position:0 3px,6px 0,0 6px,6px 3px,0 0,0 0;background-size:12px 12px}

.sp-logo{animation:sp-in .7s cubic-bezier(.2,.8,.2,1) both, sp-wipe .62s linear 2.44s forwards}
.sp-credit{clip-path:inset(0 100% 0 0);animation:sp-reveal .62s linear 2.44s forwards}
.sp-credit-glow{opacity:0;animation:sp-glow 1.2s ease-out 3s forwards}
.sp-roll{transform:translateX(-180px);animation:sp-roll 1.4s linear 2.2s forwards}
.sp-spin{animation:sp-spin 1.4s linear 2.2s forwards}
.sp-bounce{animation:sp-bounce .18s ease-in-out 2.2s 8 alternate}
.sp-streak{opacity:0;animation:sp-streak 1.4s linear 2.2s forwards}
.sp-track{transform-origin:left center;transform:scaleX(0);animation:sp-track .7s linear 2.44s forwards, sp-fade 1.4s ease 3.4s forwards}
.sp-dust{opacity:0;animation:sp-dust 1.1s cubic-bezier(.15,.7,.3,1) both}
.sp-haze{opacity:0;animation:sp-haze 2.2s ease-out 2.5s forwards}
.sp-cta{opacity:0;transform:translateY(8px);animation:sp-cta .5s ease 3.9s forwards}
.sp-shake{animation:sp-shake .5s ease-in-out 2.42s 1}

.sp-needle{transform-box:view-box;transform-origin:24px 32px;transform:rotate(-95deg);animation:sp-rev 1.7s ease-in-out .45s both}
.sp-redzone{animation:sp-zone 1.7s ease-in-out .45s both}
.sp-o-spin{transform-box:view-box;transform-origin:80px 80px;animation:sp-ospin 1.9s cubic-bezier(.15,.75,.3,1) 2.75s both}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes sp-rev{0%{transform:rotate(-95deg)}20%{transform:rotate(3deg)}38%{transform:rotate(-72deg)}62%{transform:rotate(9deg)}80%{transform:rotate(-40deg)}100%{transform:rotate(0deg)}}
@keyframes sp-zone{0%{opacity:.4}20%{opacity:1;filter:drop-shadow(0 0 3px #FF4D3D)}38%{opacity:.5;filter:none}62%{opacity:1;filter:drop-shadow(0 0 4px #FF4D3D)}80%{opacity:.6;filter:none}100%{opacity:1}}
@keyframes sp-ospin{from{transform:rotate(-200deg)}to{transform:rotate(720deg)}}
@keyframes sp-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes sp-wipe{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
@keyframes sp-reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes sp-glow{0%{opacity:0}30%{opacity:1}100%{opacity:.55}}
@keyframes sp-roll{from{transform:translateX(-180px)}to{transform:translateX(570px)}}
@keyframes sp-spin{from{transform:rotate(0)}to{transform:rotate(540deg)}}
@keyframes sp-bounce{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes sp-streak{0%{opacity:0}15%{opacity:.9}85%{opacity:.9}100%{opacity:0}}
@keyframes sp-track{to{transform:scaleX(1)}}
@keyframes sp-fade{to{opacity:0}}
@keyframes sp-dust{0%{opacity:0;transform:translate(0,0) scale(.3)}12%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--s))}}
@keyframes sp-haze{0%{opacity:0}25%{opacity:.8}100%{opacity:0}}
@keyframes sp-cta{to{opacity:1;transform:none}}
@keyframes sp-shake{0%,100%{transform:none}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}

@media (prefers-reduced-motion: reduce){
.sp-logo{animation:none;clip-path:inset(0 0 0 100%)}
.sp-credit{animation:none;clip-path:none}
.sp-credit-glow{animation:none;opacity:.55}
.sp-roll,.sp-streak,.sp-track,.sp-dust,.sp-haze{animation:none;opacity:0}
.sp-spin,.sp-bounce,.sp-shake{animation:none}
.sp-needle,.sp-redzone,.sp-o-spin{animation:none;transform:none}
.sp-cta{animation:none;opacity:1;transform:none}
}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { running: true };
  }
  componentWillUnmount() { if (this.t) clearTimeout(this.t); }
  renderVals() {
    const reds = ['#E0241B', '#FF4D3D', '#B3170F', '#FF6A4D', '#7A0F0A'];
    const dust = [];
    let k = 0;
    for (let x = 20; x <= 370; x += 25) {
      for (let j = 0; j < 2; j++) {
        const r = ((k * 37) % 17) / 17;
        const size = 12 + Math.round(r * 18);
        const delay = 2.2 + (x + 100) / 536 + j * 0.05;
        dust.push({
          x: x + 'px',
          y: (500 + j * 4) + 'px',
          size: size + 'px',
          offset: (-size / 2) + 'px 0 0 ' + (-size / 2) + 'px',
          color: reds[k % reds.length],
          blur: (1 + r * 3).toFixed(1) + 'px',
          delay: delay.toFixed(3) + 's',
          dx: (-30 - Math.round(r * 50)) + 'px',
          dy: (-24 - Math.round(((k * 53) % 13) / 13 * 60)) + 'px',
          scale: (1.6 + r * 1.6).toFixed(2)
        });
        k++;
      }
    }
    return {
      dust,
      running: this.state.running,
      replay: () => {
        this.setState({ running: false });
        if (this.t) clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ running: true }), 40);
      }
    };
  }
}
</script>
